<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>New Tab</title>
    <style>{{style}}</style>
    <style>
        .tagline {
            font-size: 28px; font-weight: 300; letter-spacing: 3px;
            color: var(--faint);
            opacity: 0; animation: fadeIn 0.8s ease 0.15s forwards;
        }
        .rule { animation-delay: 0.4s; }
        .hint {
            margin-top: 28px; font-size: 12px; letter-spacing: 0.5px; color: var(--faint);
            opacity: 0; animation: fadeIn 0.8s ease 0.7s forwards;
        }
    </style>
</head>
<body class="{{theme}}">
    <div class="container">
        <div class="tagline">your blank slate</div>
        <div class="rule"></div>
        <div class="hint">every tab is its own session &middot; close it and it is gone &middot; F1 for help</div>
    </div>
</body>
</html>
